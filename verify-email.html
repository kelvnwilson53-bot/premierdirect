<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verified | TriDashAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 flex items-center justify-center p-4">
  <main class="max-w-md w-full bg-white border border-slate-200 rounded-3xl shadow-xl p-8 text-center">
    <a href="index.html" class="text-xl font-extrabold"><span class="text-blue-600">Tri</span>DashAI</a>
    <div class="mx-auto mt-7 w-14 h-14 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-2xl">✓</div>
    <h1 class="text-2xl font-extrabold mt-5">Check your email verification</h1>
    <p class="text-sm text-slate-600 mt-3">If you arrived here after clicking the Firebase verification link, your email address has been verified. Log in to complete your business setup. Your seven-day trial will begin only after your TriDashAI phone service has been activated.</p>
    <a href="login.html" class="inline-block mt-6 rounded-xl bg-blue-600 text-white font-bold px-6 py-3">Go to login</a>
  </main>
<!-- Back-to-top control -->
<style>
#back-to-top{position:fixed;right:18px;bottom:24px;z-index:1000;width:48px;height:48px;border:1px solid #52657d;border-radius:50%;background:#29394d;color:#e7eef7;box-shadow:0 5px 16px rgba(0,0,0,.28);font-size:25px;line-height:1;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .2s ease,transform .2s ease,background .2s ease;cursor:pointer}
#back-to-top.is-visible{opacity:1;visibility:visible;transform:translateY(0)}
#back-to-top:hover,#back-to-top:focus-visible{background:#365f86;outline:2px solid #91b4d8;outline-offset:2px}
@media(prefers-reduced-motion:reduce){#back-to-top{transition:none}}
</style>
<button id="back-to-top" type="button" aria-label="Back to top" title="Back to top">↑</button>
<script>(function(){const b=document.getElementById('back-to-top');if(!b)return;const u=()=>b.classList.toggle('is-visible',window.scrollY>280);window.addEventListener('scroll',u,{passive:true});b.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));u();})();</script>

</body>
</html>
